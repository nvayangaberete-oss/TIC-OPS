
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | TIC OPS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #c9a45c;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        .line {
            width: 55px;
            height: 3px;
            background: #c9a45c;
            margin: 0 auto 30px;
            border-radius: 5px;
        }

        label {
            display: block;
            margin: 18px 0 9px;
            color: #ddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            border: 1px solid #383838;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #c9a45c;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 28px;
            background: #c9a45c;
            color: #080808;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #e4c989;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #c9a45c;
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 15px;
            background: #3b2020;
            color: #ffbaba;
            border-radius: 8px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <h1 class="logo">𝑻𝑰𝑪 𝑶𝑷𝑺💫</h1>

        <p class="subtitle">ESPACE ADMINISTRATEUR</p>

        <div class="line"></div>

        <form method="POST" action="{{ url_for('login') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="flash-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <label for="username">Nom d'utilisateur</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Votre identifiant"
                autocomplete="username"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit">SE CONNECTER</button>

        </form>

        <a class="back-link" href="/">
            ← Retour à la boutique
        </a>

    </main>

</body>
</html>
